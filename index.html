<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lantern Spire</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Roguelike deckbuilder prototype</p>
        <h1>Lantern Spire</h1>
      </div>
      <div class="run-controls">
        <button id="new-run-button" type="button">New Run</button>
      </div>
    </header>

    <section class="hero-select" id="hero-select" aria-label="Choose a character"></section>

    <section class="game-grid" id="game-grid" aria-label="Game interface">
      <aside class="panel hero-panel" aria-label="Run status">
        <div class="hero-card">
          <div class="avatar" id="hero-avatar">LS</div>
          <div>
            <p class="label">Climber</p>
            <h2 id="hero-name">Choose a climber</h2>
            <p id="hero-subtitle">Build a deck and climb.</p>
          </div>
        </div>

        <div class="meter-stack">
          <div>
            <div class="meter-label"><span>HP</span><span id="hp-text">0 / 0</span></div>
            <div class="meter hp"><span id="hp-bar"></span></div>
          </div>
          <div>
            <div class="meter-label"><span>Gold</span><span id="gold-text">0</span></div>
            <div class="coin-row" id="gold-pips"></div>
          </div>
        </div>

        <div class="stat-row">
          <div><span>Floor</span><strong id="floor-text">0</strong></div>
          <div><span>Deck</span><strong id="deck-count">0</strong></div>
          <div><span>Relics</span><strong id="relic-count">0</strong></div>
        </div>

        <div>
          <p class="label">Relics</p>
          <div class="relic-grid" id="relic-grid"></div>
        </div>

        <div>
          <p class="label">Deck</p>
          <div class="deck-list" id="deck-list"></div>
        </div>
      </aside>

      <section class="panel main-panel" aria-live="polite">
        <div class="screen" id="screen"></div>
      </section>

      <aside class="panel log-panel" aria-label="Run log">
        <div class="log-head">
          <p class="label">Run Log</p>
          <button id="compact-deck-button" type="button">Sort Deck</button>
        </div>
        <ol id="log-list"></ol>
      </aside>
    </section>
  </main>

  <script src="src/game.js"></script>
</body>
</html>
